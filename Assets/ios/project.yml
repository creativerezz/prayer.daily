name: PrayDaily
options:
  bundleIdPrefix: com.reza
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: G56KC8CS7Z
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  PrayDaily:
    type: application
    platform: iOS
    sources:
      - path: PrayDaily
      - path: ../../Sources/Hilal
        excludes:
          - Hilal.swift
          - methods.json
      - path: ../../Sources/Hilal/methods.json
        buildPhase: resources
      - path: ../../Resources/Sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: pray.daily
        PRODUCT_BUNDLE_IDENTIFIER: com.reza.praydaily
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Sage
        INFOPLIST_FILE: PrayDaily/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  pray.daily:
    build:
      targets:
        PrayDaily: all
    run:
      config: Debug
    archive:
      config: Release
